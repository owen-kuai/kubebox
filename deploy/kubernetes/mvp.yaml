apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxclasses.sandbox.kubebox.io
spec:
  group: sandbox.kubebox.io
  scope: Cluster
  names:
    plural: sandboxclasses
    singular: sandboxclass
    kind: SandboxClass
    shortNames: [sbclass]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [runtimeClassName, security]
              properties:
                runtimeClassName:
                  type: string
                  enum: [runc, gvisor, kata]
                security:
                  type: object
                  required: [runAsNonRoot, readOnlyRootFilesystem]
                  properties:
                    runAsNonRoot: {type: boolean}
                    readOnlyRootFilesystem: {type: boolean}
                    seccompProfile:
                      type: string
                      enum: [RuntimeDefault, Localhost]
                defaultResources:
                  type: object
                  properties:
                    cpu: {type: string}
                    memory: {type: string}
                warmPool:
                  type: object
                  properties:
                    minSize: {type: integer, minimum: 0}
                    maxSize: {type: integer, minimum: 0}
                    topologySpread:
                      type: boolean
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.sandbox.kubebox.io
spec:
  group: sandbox.kubebox.io
  scope: Namespaced
  names:
    plural: sandboxes
    singular: sandbox
    kind: Sandbox
    shortNames: [sbx]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [classRef, template, ttlSeconds]
              properties:
                classRef: {type: string}
                template: {type: string, minLength: 1}
                ttlSeconds: {type: integer, minimum: 30, maximum: 86400}
                resources:
                  type: object
                  properties:
                    cpu: {type: string}
                    memory: {type: string}
                network:
                  type: object
                  properties:
                    egress:
                      type: string
                      enum: [Restricted, Full]
                    allowedEgress:
                      type: array
                      items: {type: string}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Draining, Deleted, Failed]
                proxyEndpoint: {type: string}
                expiresAt: {type: string, format: date-time}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxclaims.sandbox.kubebox.io
spec:
  group: sandbox.kubebox.io
  scope: Namespaced
  names:
    plural: sandboxclaims
    singular: sandboxclaim
    kind: SandboxClaim
    shortNames: [sbclaim]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [classRef, template, ttlSeconds]
              properties:
                classRef: {type: string}
                template: {type: string}
                ttlSeconds: {type: integer, minimum: 30, maximum: 86400}
                desiredState:
                  type: string
                  enum: [Ready, Draining, Deleted]
                idempotencyKey: {type: string, minLength: 1, maxLength: 128}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Fulfilled, Finished, Released, Deleted, Failed]
                sandboxRef: {type: string}
                proxyEndpoint: {type: string}
                allocationID: {type: string}
                expiresAt: {type: string, format: date-time}
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-system
  labels:
    kubebox.io/trust-domain: control-plane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubebox-api
  namespace: sandbox-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: kubebox-api}
  template:
    metadata:
      labels: {app: kubebox-api}
    spec:
      serviceAccountName: kubebox-api
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: kubebox-api}
      containers:
        - name: api
          image: kubebox:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubebox-api
  namespace: sandbox-system
---
apiVersion: v1
kind: Service
metadata:
  name: kubebox-api
  namespace: sandbox-system
spec:
  selector: {app: kubebox-api}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-system-default-deny
  namespace: sandbox-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-system-api-ingress
  namespace: sandbox-system
spec:
  podSelector:
    matchLabels: {app: kubebox-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-tenant-example
  labels:
    kubebox.io/trust-domain: sandbox-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-tenant-default-deny
  namespace: sandbox-tenant-example
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-tenant-allow-proxy
  namespace: sandbox-tenant-example
spec:
  podSelector:
    matchLabels: {kubebox.io/workload: sandbox}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: sandbox-system}
          podSelector:
            matchLabels: {app: envd-proxy}
      ports:
        - protocol: TCP
          port: 50051
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: sandbox-system}
          podSelector:
            matchLabels: {app: audit-collector}
      ports:
        - protocol: TCP
          port: 443
